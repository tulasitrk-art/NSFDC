version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: nsfdc_postgis_db
    environment:
      POSTGRES_USER: nsfdc_admin
      POSTGRES_PASSWORD: nsfdc_secure_password
      POSTGRES_DB: nsfdc_portal_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/app/db/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nsfdc_admin -d nsfdc_portal_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nsfdc_backend_api
    environment:
      DATABASE_URL: postgresql://nsfdc_admin:nsfdc_secure_password@db:5432/nsfdc_portal_db
      SECRET_KEY: nsfdc_secret_key_gov_india_prod_2026
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nsfdc_frontend_web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
